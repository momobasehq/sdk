name: Publish SDK to npm

on:
    workflow_dispatch:
        inputs:
            increment:
                description: SemVer increment for the SDK release
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write

concurrency:
    group: npm-sdk-release
    cancel-in-progress: false

jobs:
    release:
        name: Publish SDK
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/setup@v2
              with:
                  version: 11
                  runtime: node@24

            - name: Upgrade npm for trusted publishing
              run: npm install --global npm@latest

            - name: Install dependencies
              run: pnpm ci

            - name: Configure release author
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Authenticate with npm
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=project

            - name: Release SDK
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  RELEASE_INCREMENT: ${{ inputs.increment }}
              run: pnpm run release -- "$RELEASE_INCREMENT" --ci
