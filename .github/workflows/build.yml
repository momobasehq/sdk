name: SDK

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Typecheck and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/setup@v2
              with:
                  version: 11
                  runtime: node@24
                  cache: true

            - name: Install dependencies
              run: pnpm ci

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

            - name: Build
              run: pnpm run build
